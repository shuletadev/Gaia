<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Project Gaia">
  <defs>
    <linearGradient id="g-planet" x1="18" y1="16" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ff0d2"/>
      <stop offset="0.55" stop-color="#3dd6b0"/>
      <stop offset="1" stop-color="#0f6b5a"/>
    </linearGradient>
    <linearGradient id="g-ring" x1="6" y1="40" x2="58" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#ffb08f"/>
    </linearGradient>
    <clipPath id="g-front"><rect x="0" y="32" width="64" height="32"/></clipPath>
    <clipPath id="g-back"><rect x="0" y="0" width="64" height="32"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0c0d10"/>
  <!-- orbit, back half (behind the planet) -->
  <g transform="rotate(-18 32 32)" clip-path="url(#g-back)">
    <ellipse cx="32" cy="32" rx="25" ry="8.5" fill="none" stroke="url(#g-ring)" stroke-width="2.4" opacity="0.45"/>
  </g>
  <!-- planet -->
  <circle cx="32" cy="32" r="14.5" fill="url(#g-planet)"/>
  <!-- land masses -->
  <path d="M24.5 24.5c3.2-1.6 6.9-1.1 8.4 1.2 1.2 1.9-.5 3.6-2.7 3.9-2.5.3-3 2.4-5 2.2-2.1-.2-3.1-2.2-2.6-4.2.3-1.2 1-2.4 1.9-3.1z" fill="#0c0d10" opacity="0.28"/>
  <path d="M35.5 34.5c2.3-.6 5.2.6 5.6 2.8.4 2.3-1.6 4.6-4.3 5.2-2.2.5-3.6-.9-3.4-2.8.1-1.4.8-2.1.6-3.1-.2-1 .3-1.8 1.5-2.1z" fill="#0c0d10" opacity="0.28"/>
  <!-- terminator shade -->
  <path d="M32 17.5a14.5 14.5 0 0 1 0 29a11 14.5 0 0 0 0-29z" fill="#0c0d10" opacity="0.22"/>
  <!-- orbit, front half -->
  <g transform="rotate(-18 32 32)" clip-path="url(#g-front)">
    <ellipse cx="32" cy="32" rx="25" ry="8.5" fill="none" stroke="url(#g-ring)" stroke-width="2.4"/>
  </g>
  <!-- moon on the orbit -->
  <circle cx="55.9" cy="25.8" r="3.1" fill="#ff6a3d"/>
  <circle cx="55.9" cy="25.8" r="5" fill="#ff6a3d" opacity="0.18"/>
</svg>
