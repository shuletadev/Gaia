<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooperativa · Sistema central</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, "Segoe UI", sans-serif; background:#f1f3f8; color:#1c2540; }
  header { background:#2f4d9e; color:#fff; padding:18px 20px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:3px 0 0; opacity:.9; }
  main { max-width:640px; margin:0 auto; padding:20px; }
  .card { background:#fff; border:1px solid #d9deec; border-radius:14px; padding:18px; }
  .server { display:inline-block; background:#2f4d9e; color:#fff; border-radius:999px; padding:4px 16px; font-weight:700; font-size:20px; }
  small { color:#5b6585; }
  @media (prefers-color-scheme: dark) {
    body { background:#0f1424; color:#e6e9f5; }
    .card { background:#171e36; border-color:#27315a; }
    small { color:#9aa5d0; }
  }
</style>
</head>
<body>
<header>
  <h1>Cooperativa de ahorro y crédito</h1>
  <p>Sistema central · San Ramón (ficticio)</p>
</header>
<main>
  <section class="card">
    <p>Esta solicitud la atendió el servidor:</p>
    <p><span class="server">__SERVIDOR__</span></p>
    <p><small>Recargue varias veces: el balanceador de carga reparte las solicitudes entre los dos servidores. Si uno falla, todo el tráfico va al otro.</small></p>
  </section>
</main>
</body>
</html>
